name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck, Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Guards against a test file existing but being unreachable from every
      # test:* script — i.e. a suite that can never run. Cheap; run it before
      # the suites so the failure mode is named rather than invisible.
      - name: Test reachability guard
        run: pnpm test:coverage-check

      # The FULL matrix, not just `pnpm test`. Before 2026-08 this step ran one
      # of 15 suites, so payments, webhooks, security, CRM and SEO coverage
      # existed but was never enforced on a PR.
      - name: Unit & integration tests (full matrix)
        run: pnpm test:all
        env:
          # Prisma client is constructed at import time; provide a placeholder DSN.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-32-characters' }}

      - name: Build
        run: pnpm build
        env:
          # Required for build — Vercel supplies real values in production
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://autolenis.com' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-32-characters' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

  # The migration chain had never been executed against an empty database: CI had
  # no database job, so every migration was only ever validated against whatever
  # state the live Supabase instance happened to be in when it was written.
  # `prisma migrate deploy` failed at migration 22 of 94 on a fresh provision, so
  # a new environment, a preview branch, and a restore-from-zero were impossible,
  # and the chain had drifted from schema.prisma unnoticed.
  #
  # This job is the gate that makes that class of defect impossible to land:
  # a real postgres, an empty database, the whole chain, then a drift check.
  migrations:
    name: Migration chain (empty DB -> schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        # Pinned rather than :16 so the gate cannot change underneath a PR.
        image: postgres:16.4
        env:
          POSTGRES_USER: autolenis_ci
          POSTGRES_DB: autolenis_ci
          # No password, by design. This container is created for one job, listens
          # only on the runner's localhost, holds nothing but a throwaway schema,
          # and is destroyed with the runner. Setting a password would mean writing
          # a credential-shaped literal into a tracked file — which secret scanning
          # correctly flags, and which would have to be triaged as a non-incident
          # on every future PR. Removing the credential is better than teaching
          # people to wave the scanner through.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autolenis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autolenis_ci@localhost:5432/autolenis_ci
      DIRECT_URL: postgresql://autolenis_ci@localhost:5432/autolenis_ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Assert the starting state rather than trusting it. If the service image
      # ever ships with tables, every result below would be meaningless.
      - name: Assert the database is empty
        run: |
          COUNT=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables before migrating: $COUNT"
          test "$COUNT" -eq 0

      # The headline gate. Before this job existed, this command failed at
      # migration 22 of 94 and nothing noticed.
      - name: Apply the full migration chain to an empty database
        run: pnpm exec prisma migrate deploy

      # Applying twice must be a no-op. This catches a migration that succeeds
      # once but is not idempotent — the defect class behind the duplicate-
      # timestamp collision in 20260702000000.
      - name: Re-apply (must be a no-op)
        run: pnpm exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Functional drift is gated at hard zero; structural drift is ratcheted.
      # See scripts/check-migration-drift.ts for why the two differ.
      - name: Drift — chain-built database vs schema.prisma
        run: pnpm db:check-drift

      # The documented fresh-provision runbook (prisma/MIGRATIONS.md) is the
      # Prisma chain PLUS the 15 numbered CRM/workflow files. Before Batch 7,
      # 14 of the 15 failed on a fresh database — a misnamed acquisition table
      # squatted on the "conversations" name the CRM inbox needs, and two seed
      # files carried an ON CONFLICT arbiter that can never match their own
      # partial unique index. This step runs AFTER the drift check on purpose:
      # the drift contract is chain-vs-schema, and these tables are
      # deliberately not Prisma-managed.
      - name: CRM provisioning runbook (the 15 numbered files)
        run: |
          for f in migrations/*.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # And a second pass: every file claims idempotency (IF NOT EXISTS /
      # ON CONFLICT DO NOTHING), so re-running the runbook must succeed too.
      - name: CRM provisioning runbook (re-run must be a no-op)
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      # Blocking gate. The tree currently carries 0 critical / 23 high / 11
      # moderate / 2 low advisories (mostly transitive, e.g. nanoid via
      # @tailwindcss/postcss). Gating at `critical` is what passes today, so a
      # NEW critical advisory reds the build instead of landing silently.
      # Raising this to `high` requires clearing the existing 23 first —
      # deliberate remediation work, not a flag flip.
      - name: Block on critical advisories
        run: pnpm audit --audit-level critical

      # Non-blocking visibility on the backlog above.
      - name: Report high advisories
        run: pnpm audit --audit-level high || true
