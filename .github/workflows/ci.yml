name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck, Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Guards against a test file existing but being unreachable from every
      # test:* script — i.e. a suite that can never run. Cheap; run it before
      # the suites so the failure mode is named rather than invisible.
      - name: Test reachability guard
        run: pnpm test:coverage-check

      # The FULL matrix, not just `pnpm test`. Before 2026-08 this step ran one
      # of 15 suites, so payments, webhooks, security, CRM and SEO coverage
      # existed but was never enforced on a PR.
      # SAFETY GUARDS RUN FIRST, ON PURPOSE.
      #
      # `test:all` is a single `&&` chain, so every suite after the first failure never executes.
      # A pre-existing failure early in that chain therefore silently disables the suites that
      # protect the database and the parity ledger — exactly the two things that must never depend
      # on the health of an unrelated test. Running them in their own step, ahead of the matrix,
      # makes them execute on every pull request regardless of what else is red. They also stay in
      # `test:all` (the reachability guard requires it) — this step is an additional, independent
      # execution, not a relocation.
      - name: Safety guards (isolated-database + parity ledger)
        run: |
          pnpm test:isolated-db
          pnpm test:parity-ledger

      # What does the DATABASE_URL secret actually point at? GitHub never discloses a stored
      # secret's value, so the only party that can answer is a job it is injected into. This prints
      # four non-secret facts — host, database, Supabase project reference, and a production /
      # non-production classification — and never the user, password or DSN. It opens no
      # connection. Reporting only; the enforcement lives in the destructive suite's own guard.
      - name: Database target report (sanitized — never prints the DSN)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:report-target

      # `test:all` deliberately does NOT include `test:concurrency`. This job has no database:
      # the DSN below is a placeholder that points at nothing, which is fine for suites that only
      # need a Prisma client to construct at import time, and useless for a suite that writes rows.
      # The destructive suite therefore runs in the e2e job, against that job's own ephemeral
      # `autolenis_e2e` service. Re-adding it to `test:all` puts a destructive suite back in a job
      # whose DSN is `secrets.DATABASE_URL || <placeholder>` — an unknown target — so
      # `isolated-database.test.ts` fails the build if it reappears there.
      - name: Unit & integration tests (full matrix)
        run: pnpm test:all
        env:
          # Prisma client is constructed at import time; provide a placeholder DSN.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-32-characters' }}

      - name: Build
        run: pnpm build
        env:
          # Required for build — Vercel supplies real values in production
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://autolenis.com' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-32-characters' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

  # The migration chain had never been executed against an empty database: CI had
  # no database job, so every migration was only ever validated against whatever
  # state the live Supabase instance happened to be in when it was written.
  # `prisma migrate deploy` failed at migration 22 of 94 on a fresh provision, so
  # a new environment, a preview branch, and a restore-from-zero were impossible,
  # and the chain had drifted from schema.prisma unnoticed.
  #
  # This job is the gate that makes that class of defect impossible to land:
  # a real postgres, an empty database, the whole chain, then a drift check.
  migrations:
    name: Migration chain (empty DB -> schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        # Pinned rather than :17 so the gate cannot change underneath a PR, and
        # pinned to production's MAJOR (17) because that is where the DDL
        # transaction semantics this repository depends on are decided:
        # `ALTER TYPE ... ADD VALUE` cannot be used in the transaction that added
        # it, and `CREATE INDEX CONCURRENTLY` cannot run inside one at all. A gate
        # on 16.x is a gate on different rules than production enforces.
        image: postgres:17.6
        env:
          POSTGRES_USER: autolenis_ci
          POSTGRES_DB: autolenis_ci
          # No password, by design. This container is created for one job, listens
          # only on the runner's localhost, holds nothing but a throwaway schema,
          # and is destroyed with the runner. Setting a password would mean writing
          # a credential-shaped literal into a tracked file — which secret scanning
          # correctly flags, and which would have to be triaged as a non-incident
          # on every future PR. Removing the credential is better than teaching
          # people to wave the scanner through.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autolenis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autolenis_ci@localhost:5432/autolenis_ci
      DIRECT_URL: postgresql://autolenis_ci@localhost:5432/autolenis_ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── PostgreSQL version gate ──────────────────────────────────────────────
      # Runs BEFORE any migration or database-writing step, and reads only.
      #
      # The MAJOR version is the gate and it fails the job, because major is where
      # the DDL transaction semantics differ — a new enum label cannot be used in
      # the transaction that added it, and CREATE INDEX CONCURRENTLY cannot run in
      # a transaction at all. Proving a migration on a different major proves it
      # against different rules. That gap is what let the enum-in-transaction
      # defect survive its first review.
      #
      # The PATCH level is reported, not enforced. Production runs on Supabase's
      # upgrade schedule; a patch bump there is routine and must never turn this
      # build red. 170006 is the level production was last observed at — it is a
      # reference point for the warning, not an equality assertion.
      - name: Assert PostgreSQL major version (migration chain)
        run: |
          set -euo pipefail
          VER=$(psql "$DATABASE_URL" -tAc "SHOW server_version")
          NUM=$(psql "$DATABASE_URL" -tAc "SHOW server_version_num")
          MAJOR=$(( NUM / 10000 ))
          echo "server_version     = $VER"
          echo "server_version_num = $NUM"
          echo "major              = $MAJOR"
          {
            echo "### PostgreSQL — migration chain"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| \`server_version\` | \`$VER\` |"
            echo "| \`server_version_num\` | \`$NUM\` |"
            echo "| major | \`$MAJOR\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAJOR" -ne 17 ]; then
            echo "::error::PostgreSQL major $MAJOR, expected 17. Production runs 17.x and the DDL transaction rules this repository relies on are decided by the major version. Refusing to verify migrations against a different major."
            echo "**FAILED — major \`$MAJOR\`, expected \`17\`.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$NUM" -ne 170006 ]; then
            echo "::warning::PostgreSQL patch level $NUM differs from production's last observed 170006. This is informational — Supabase patches on its own schedule and a patch bump is not a defect."
            echo "Patch level \`$NUM\` differs from production's last observed \`170006\` (informational; not a failure)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Patch level matches production's last observed \`170006\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Assert the starting state rather than trusting it. If the service image
      # ever ships with tables, every result below would be meaningless.
      - name: Assert the database is empty
        run: |
          COUNT=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables before migrating: $COUNT"
          test "$COUNT" -eq 0

      # The headline gate. Before this job existed, this command failed at
      # migration 22 of 94 and nothing noticed.
      - name: Apply the full migration chain to an empty database
        run: pnpm exec prisma migrate deploy

      # Applying twice must be a no-op. This catches a migration that succeeds
      # once but is not idempotent — the defect class behind the duplicate-
      # timestamp collision in 20260702000000.
      - name: Re-apply (must be a no-op)
        run: pnpm exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Functional drift is gated at hard zero; structural drift is ratcheted.
      # See scripts/check-migration-drift.ts for why the two differ.
      - name: Drift — chain-built database vs schema.prisma
        run: pnpm db:check-drift

      # Ledger drift: does _prisma_migrations agree with the physical schema?
      # A chain-built database is complete by construction, so this pass proves
      # only that the checker does not false-positive. The step below is the one
      # that proves it WORKS — see scripts/check-ledger-drift.ts for the incident.
      - name: Ledger — _prisma_migrations vs the physical schema
        run: pnpm db:check-ledger

      # The detection test. Deleting a ledger row for an already-applied migration
      # reproduces exactly the state production was in on 2026-09-03: the objects
      # exist, the row does not. `prisma migrate status` calls that "not yet
      # applied" and is wrong. The checker must FAIL here, or it is decorative.
      - name: Ledger check detects a deleted row (must fail, then restore)
        run: |
          set -euo pipefail
          VICTIM=20261105000000_inventory_dealer_provenance_and_call_accounting
          ROW=$(psql "$DATABASE_URL" -tAc \
            "select migration_name from _prisma_migrations where migration_name='$VICTIM'")
          test "$ROW" = "$VICTIM"
          psql "$DATABASE_URL" -q -c \
            "delete from _prisma_migrations where migration_name='$VICTIM'"

          if pnpm db:check-ledger; then
            echo "::error::check-ledger PASSED against a database with a deleted ledger row."
            exit 1
          fi
          echo "check-ledger correctly failed on the removed row."

          # Restore by the documented repair path, so the repair is tested too.
          pnpm exec prisma migrate resolve --applied "$VICTIM"
          pnpm db:check-ledger

      # The documented fresh-provision runbook (prisma/MIGRATIONS.md) is the
      # Prisma chain PLUS the 15 numbered CRM/workflow files. Before Batch 7,
      # 14 of the 15 failed on a fresh database — a misnamed acquisition table
      # squatted on the "conversations" name the CRM inbox needs, and two seed
      # files carried an ON CONFLICT arbiter that can never match their own
      # partial unique index. This step runs AFTER the drift check on purpose:
      # the drift contract is chain-vs-schema, and these tables are
      # deliberately not Prisma-managed.
      - name: CRM provisioning runbook (the 15 numbered files)
        run: |
          for f in migrations/*.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # And a second pass: every file claims idempotency (IF NOT EXISTS /
      # ON CONFLICT DO NOTHING), so re-running the runbook must succeed too.
      - name: CRM provisioning runbook (re-run must be a no-op)
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

  # Playwright had no CI job at all: three E2E specs existed and none of them had
  # ever run on a pull request. This job runs the outreach suite against a real
  # browser, a real Next server and a real migrated database, and asserts
  # DATABASE STATE rather than visible text.
  #
  # SCOPE, AND WHY IT IS NARROW. tests/e2e also holds dealer-funnel,
  # affiliate-portal and buyer-remediation. Those drive flows that call
  # supabase.auth.admin.createUser(), which has no local stub, so running them
  # here would red the build for missing infrastructure rather than for a defect.
  # Widening this job means standing up Supabase auth first — a deliberate piece
  # of work, not a glob change. Naming the file is the honest boundary.
  e2e:
    name: E2E (dealer outreach)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        # Production's major. See the migrations job for why 17 is the boundary.
        image: postgres:17.6
        env:
          POSTGRES_USER: autolenis_ci
          # The database name is load-bearing, not cosmetic: every spec and the
          # storage-state script refuse to run unless DATABASE_URL contains
          # "autolenis_e2e". That guard is what makes it impossible for this job
          # to be pointed at a real database by an edit to one env line.
          POSTGRES_DB: autolenis_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autolenis_ci -d autolenis_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://autolenis_ci@localhost:5432/autolenis_e2e
      DIRECT_URL: postgresql://autolenis_ci@localhost:5432/autolenis_e2e
      JWT_SECRET: ci-placeholder-jwt-secret-32-characters
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_STORAGE_STATE: /tmp/autolenis-e2e-admin.json
      # No TWILIO_*, no RESEND_API_KEY, no APOLLO_API_KEY, and the send flag left
      # unset. Even if a gate were bypassed there is no credential to send with.

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── PostgreSQL version gate ──────────────────────────────────────────────
      # Runs BEFORE any migration or database-writing step, and reads only.
      #
      # The MAJOR version is the gate and it fails the job, because major is where
      # the DDL transaction semantics differ — a new enum label cannot be used in
      # the transaction that added it, and CREATE INDEX CONCURRENTLY cannot run in
      # a transaction at all. Proving a migration on a different major proves it
      # against different rules. That gap is what let the enum-in-transaction
      # defect survive its first review.
      #
      # The PATCH level is reported, not enforced. Production runs on Supabase's
      # upgrade schedule; a patch bump there is routine and must never turn this
      # build red. 170006 is the level production was last observed at — it is a
      # reference point for the warning, not an equality assertion.
      - name: Assert PostgreSQL major version (e2e)
        run: |
          set -euo pipefail
          VER=$(psql "$DATABASE_URL" -tAc "SHOW server_version")
          NUM=$(psql "$DATABASE_URL" -tAc "SHOW server_version_num")
          MAJOR=$(( NUM / 10000 ))
          echo "server_version     = $VER"
          echo "server_version_num = $NUM"
          echo "major              = $MAJOR"
          {
            echo "### PostgreSQL — e2e"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| \`server_version\` | \`$VER\` |"
            echo "| \`server_version_num\` | \`$NUM\` |"
            echo "| major | \`$MAJOR\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAJOR" -ne 17 ]; then
            echo "::error::PostgreSQL major $MAJOR, expected 17. Production runs 17.x and the DDL transaction rules this repository relies on are decided by the major version. Refusing to verify migrations against a different major."
            echo "**FAILED — major \`$MAJOR\`, expected \`17\`.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$NUM" -ne 170006 ]; then
            echo "::warning::PostgreSQL patch level $NUM differs from production's last observed 170006. This is informational — Supabase patches on its own schedule and a patch bump is not a defect."
            echo "Patch level \`$NUM\` differs from production's last observed \`170006\` (informational; not a failure)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Patch level matches production's last observed \`170006\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply the migration chain
        run: pnpm exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm build

      - name: Install the Playwright browser
        # Only chromium, and only here. The agent image ships one preinstalled;
        # a GitHub runner does not.
        run: pnpm exec playwright install --with-deps chromium

      # Same readiness probe visual.yml uses. There is no /api/health route in
      # this app, so the check is a 200 on / — polled, not slept on.
      - name: Start the app
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then echo "app up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not become ready on :3000"; exit 1

      # Admin auth is a self-contained JWT cookie (lib/auth/admin-session.ts:
      # "NEVER touches Supabase auth"), so an authenticated session can be minted
      # from JWT_SECRET without an auth provider. The script refuses to run
      # unless DATABASE_URL targets autolenis_e2e.
      - name: Mint an admin session
        run: pnpm exec tsx scripts/e2e-admin-storage-state.ts

      # The destructive concurrency suite, run against a positively identified ephemeral service.
      #
      # This job already provisions postgres with POSTGRES_DB=autolenis_e2e on the runner's
      # localhost, destroyed with the runner — precisely the shape the suite's allowlist requires,
      # and reused here rather than standing up a second one. It is NEVER pointed at
      # secrets.DATABASE_URL: an unknown secret cannot be shown to be disposable, and the guard
      # would refuse it anyway. CI=true is what makes a refusal FAIL this step instead of skipping
      # it, so "the suite did not run" can never be reported as success.
      - name: Concurrency (destructive — ephemeral autolenis_e2e only)
        env:
          CI: "true"
        run: pnpm test:concurrency

      - name: E2E — dealer outreach
        run: pnpm exec playwright test --config playwright.e2e.config.ts tests/e2e/dealer-outreach.spec.ts

      - name: Upload the trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-outreach-report
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: ignore

  # The strongest verification in this repository — and until now nothing ran it.
  #
  # The `migrations` job builds the schema from EMPTY through the Prisma chain.
  # That is a real gate, but it is a gate on a schema production does not have:
  # the chain yields 223 tables where production has 249, 2,684 columns where
  # production has 2,976, and zero policies where production has 23. Four tables
  # the Phase 1 wave adopts already exist in production and do not exist in a
  # chain replay at all, so the chain never exercises the
  # `CREATE TABLE IF NOT EXISTS` no-op path. The migrations job is correct about
  # the wrong schema.
  #
  # This job restores production's committed schema-only baseline, proves the
  # restore is faithful on eight full-definition digests, then applies the Phase 1
  # pair, verifies every expected object, applies again and asserts the no-op.
  #
  # It needs no Node and no application dependencies: the proof is psql and SQL.
  phase1-proof:
    name: Phase 1 proof (production physical schema)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Production's major, same reasoning as the migrations job.
        image: postgres:17.6
        env:
          POSTGRES_USER: autolenis_ci
          POSTGRES_DB: autolenis_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autolenis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Loopback only, and a database name the proof runner creates and destroys
      # itself. No secret is read by this job; there is no DATABASE_URL to leak.
      PROOF_HOST: 127.0.0.1
      PROOF_PORT: "5432"
      PROOF_USER: autolenis_ci
      PROOF_DB: autolenis_prodbase
      ADMIN_URL: postgresql://autolenis_ci@127.0.0.1:5432/postgres
      BASE_URL: postgresql://autolenis_ci@127.0.0.1:5432/autolenis_prodbase
      PROOF_DIR: docs/transaction-flow/phase-1-proof

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Assert PostgreSQL major version (phase 1 proof)
        run: |
          set -euo pipefail
          VER=$(psql "$ADMIN_URL" -tAc "SHOW server_version")
          NUM=$(psql "$ADMIN_URL" -tAc "SHOW server_version_num")
          MAJOR=$(( NUM / 10000 ))
          echo "server_version     = $VER"
          echo "server_version_num = $NUM"
          echo "major              = $MAJOR"
          {
            echo "### PostgreSQL — phase 1 proof"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| \`server_version\` | \`$VER\` |"
            echo "| \`server_version_num\` | \`$NUM\` |"
            echo "| major | \`$MAJOR\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAJOR" -ne 17 ]; then
            echo "::error::PostgreSQL major $MAJOR, expected 17. The proof asserts production's DDL transaction semantics and cannot be run on another major."
            echo "**FAILED — major \`$MAJOR\`, expected \`17\`.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$NUM" -ne 170006 ]; then
            echo "::warning::PostgreSQL patch level $NUM differs from production's last observed 170006. Informational only."
            echo "Patch level \`$NUM\` differs from production's last observed \`170006\` (informational; not a failure)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Patch level matches production's last observed \`170006\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Restore the committed baseline on its own and prove it reproduces
      # production, BEFORE any migration touches it. The eight digests below are
      # over sorted object DEFINITIONS, not counts: two schemas with the same
      # number of indexes but a different predicate on one of them produce
      # different digests. They were measured against production read-only and are
      # recorded in `${PROOF_DIR}/README.md`; a mismatch here means the committed
      # dump no longer reproduces production and the proof built on it is void.
      - name: Restore the baseline and assert the eight full-definition digests
        run: |
          set -euo pipefail
          psql "$ADMIN_URL" -q -c 'DROP DATABASE IF EXISTS autolenis_prodbase;' \
                               -c 'CREATE DATABASE autolenis_prodbase;'
          for f in "$PROOF_DIR"/production-baseline/[0-9]*.sql; do
            psql "$BASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

          psql "$BASE_URL" -At -F$'\n' -f "$PROOF_DIR/production-baseline/digests.sql" > /tmp/digests-actual.txt

          # Provenance: measured read-only against production project
          # aieybibvewmvrubcpthm and recorded in the proof README. Kept here so the
          # assertion is executable rather than a claim in prose.
          {
            echo 'tables_d=20a57af430e216a81e3f78037f2e8710'
            echo 'cols_d=9cbd2c69756985508661eb5df43b929c'
            echo 'idx_d=e70929fd3a3f35b05ada4dd6c94b3da3'
            echo 'cons_d=3cb59e667290ee423a36bb46c01252f4'
            echo 'enums_d=b3da03427662d577eeeec93be5f6a950'
            echo 'trg_d=6ae2e83c90749678d184e61fc8edac4d'
            echo 'pol_d=0b3104b3280862b0c442f588f931224f'
            echo 'fn_d=55b65dd6d0c412dc24a910338b2aa01b'
          } > /tmp/digests-expected.txt

          echo "--- digests computed from the restored baseline ---"
          cat /tmp/digests-actual.txt
          {
            echo "### Baseline fidelity — eight full-definition digests"
            echo ""
            echo '```'
            cat /tmp/digests-actual.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! diff -u /tmp/digests-expected.txt /tmp/digests-actual.txt; then
            echo "::error::The restored baseline does not reproduce production. A digest is over sorted object definitions, so this means an object's DEFINITION differs, not merely a count. The Phase 1 proof below would be proving something against a schema production does not have."
            echo "**FAILED — digest mismatch; the committed baseline no longer reproduces production.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all eight digests match production"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All eight digests match production." >> "$GITHUB_STEP_SUMMARY"

      # The committed runner, unmodified, end to end: restore -> apply both
      # directories in order (each in ONE transaction, as Prisma runs them) ->
      # verify every expected object -> apply both AGAIN -> verify -> assert the
      # census and every object definition are unchanged. It fails on a missing
      # object, on a verifier that produced no TOTAL row, and on any drift across
      # the two applications.
      - name: Run the committed proof end to end
        run: |
          set -euo pipefail
          "$PROOF_DIR/run-proof.sh" 2>&1 | tee /tmp/proof.log
          {
            echo "### Phase 1 proof"
            echo ""
            echo '```'
            grep -vE 'NOTICE:' /tmp/proof.log | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.33.0
          run_install: false

      # Blocking gate. The tree currently carries 0 critical / 23 high / 11
      # moderate / 2 low advisories (mostly transitive, e.g. nanoid via
      # @tailwindcss/postcss). Gating at `critical` is what passes today, so a
      # NEW critical advisory reds the build instead of landing silently.
      # Raising this to `high` requires clearing the existing 23 first —
      # deliberate remediation work, not a flag flip.
      - name: Block on critical advisories
        run: pnpm audit --audit-level critical

      # Non-blocking visibility on the backlog above.
      - name: Report high advisories
        run: pnpm audit --audit-level high || true
